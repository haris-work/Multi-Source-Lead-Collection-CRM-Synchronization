services:
  external-crm-api:
    build:
      context: ./external-CRM-API
    container_name: p02-external-crm-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./external-CRM-API:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
